<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<!-- Веб-приложение на экране «Домой»: своё имя, значок, без строки адреса. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starwind">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<title>Starwind</title>
<style>
/* Пульт — та же дизайн-система, что на телевизоре (IosPalette), в масштабе телефона: всё ровно вдвое меньше.
   Цвета — точные значения палитры; размеры шрифта, скругления и отступы — токены телевизора / 2.
   Новых цветов, размеров и отступов здесь не пишут: только var(--…). Проверяет RemoteTest. */
:root{color-scheme:dark;
  --black:#000000;--gray6:#1c1c1e;--gray5:#2c2c2e;--gray4:#3a3a3c;--gray3:#48484a;--gray2:#636366;--gray1:#8e8e93;
  --ink:#f5f5f7;--secondary:#aeaeb2;--tertiary:#6e6e73;--on-light:#0b0b0d;
  --red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--green:#30d158;--teal:#40c8e0;--blue:#0a84ff;--indigo:#5e5ce6;--purple:#bf5af2;--pink:#ff375f;
  --scrim-strong:#000000d9;--scrim:#000000b3;--scrim-soft:#00000066;--hairline:#ffffff4d;--glass:#ffffff1f;
  --display:44px;--title:22px;--headline:17px;--body:15px;--callout:13px;--footnote:11px;
  --r-badge:5px;--r-row:10px;--r-card:13px;--r-pill:20px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --glow:var(--orange)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--black)}html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:var(--headline)/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s4) calc(env(safe-area-inset-bottom) + var(--s7) + var(--s7));-webkit-user-select:none;user-select:none;min-height:100vh}
/* Свечение, как на телевизоре: цвет выбранного приложения расходится от верха экрана (GLOW палитры). */
#glow{position:fixed;inset:-20vh -30vw auto;height:80vh;pointer-events:none;z-index:-1;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 47%,transparent),transparent);opacity:.6;transition:background .6s ease}
@supports not (background:color-mix(in srgb,red 50%,blue)){#glow{background:radial-gradient(closest-side,var(--glow),transparent);opacity:.3}}
h1{font-size:var(--title);font-weight:700;margin:var(--s2) var(--s1) var(--s4)}
h2{font-size:var(--callout);font-weight:500;color:var(--secondary);margin:var(--s5) var(--s2) var(--s2)}
.tab{display:none}.tab.on{display:block}
.card{background:var(--gray6);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;gap:var(--s2);padding:var(--s2);align-items:center}
input[type=text],input[type=url],input[type=search]{flex:1;min-width:0;font:inherit;font-size:var(--headline);color:inherit;background:var(--gray5);border:0;border-radius:var(--r-row);padding:var(--s3) var(--s3);outline:none;-webkit-user-select:text;user-select:text}
input::placeholder{color:var(--tertiary)}
button{font:inherit;font-weight:600;border:0;border-radius:var(--r-row);padding:var(--s3) var(--s4);background:var(--ink);color:var(--on-light);cursor:pointer;transition:transform .12s ease,background .2s}
button.s{background:var(--gray5);color:var(--ink)}
button.r{background:none;color:var(--red);font-weight:500}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--hairline);outline-offset:2px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--secondary)}.danger{color:var(--red)}

/* Ряд приложений, как док телевизора: цветные логотипы, выбранное — тонкая линия по краю (HAIRLINE). */
.dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.app{background:var(--gray6);border-radius:var(--r-card);padding:0;aspect-ratio:1.25;display:flex;align-items:center;justify-content:center}
.app img{width:46%;aspect-ratio:1;object-fit:contain}
.app.lit{box-shadow:inset 0 0 0 1px var(--hairline)}

/* Кликпад как у пульта Apple TV: тёмное кольцо, точки направлений, центральная кнопка без надписи. */
.pad{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:var(--s5) auto var(--s4);border-radius:50%;background:var(--gray6);box-shadow:inset 0 0 0 1px var(--glass)}
.pad button{position:absolute;background:none;width:32%;height:32%;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.pad button:not(.ok)::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gray1);transition:background .15s}
.pad button:not(.ok):active{background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 40%,transparent),transparent);transform:none}
.pad button:not(.ok):active::after{background:var(--ink)}
.pad .u{left:34%;top:2%}.pad .d{left:34%;bottom:2%}.pad .l{left:2%;top:34%}.pad .rt{right:2%;top:34%}
.pad .ok{left:30%;top:30%;width:40%;height:40%;background:var(--gray5);box-shadow:inset 0 0 0 1px var(--glass)}
.pad .ok:active{background:var(--gray4);transform:scale(.97)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.keys button{background:var(--gray6);color:var(--secondary);padding:0;height:64px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-card)}
.keys button:active{color:var(--ink)}
.keys button.danger{color:var(--red)}
.keys button svg{width:26px;height:26px}

.list>*{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:none;border-radius:0;border-top:.5px solid var(--gray4);padding:var(--s3) var(--s4);font-weight:400;color:var(--ink)}
.list>*:first-child{border-top:0}
.list button:active{background:var(--gray5);transform:none}
.list .name{flex:1;min-width:0}
.list .name small{display:block;color:var(--secondary);font-size:var(--callout);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list a{color:var(--ink);font-weight:600;text-decoration:none}
.list .r{padding:0 0 0 var(--s3)}
.tag{font-size:var(--callout);color:var(--secondary);white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s4) var(--s3);border-top:0!important}
.acts button{padding:var(--s2) var(--s3);font-size:var(--body)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.stat{background:var(--gray6);border-radius:var(--r-card);padding:var(--s3) var(--s4)}
.stat.wide{grid-column:1/-1}
.stat b{display:block;font-size:var(--title);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat span{font-size:var(--callout);color:var(--secondary)}
.bar{height:4px;border-radius:var(--r-badge);background:var(--gray4);margin-top:var(--s2);overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--glow);transition:width .6s}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:var(--r-pill);background:var(--gray4);position:relative;flex:none;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
img.shot{display:block;width:100%;border-radius:var(--r-card);margin-top:var(--s3);border:1px solid var(--glass)}
.file{position:relative;overflow:hidden;flex:1}.file input{position:absolute;inset:0;opacity:0}
progress{width:100%;height:4px;display:none;accent-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--gray6);border-radius:var(--r-row);padding:3px;margin-top:var(--s1)}
.seg button{background:none;color:var(--secondary);font-size:var(--body);font-weight:600;padding:var(--s2);border-radius:var(--r-row)}
.seg button.on{background:var(--gray4);color:var(--ink)}

/* Нижняя панель вкладок, как в приложениях iPhone: стекло поверх GRAY6. */
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  padding:var(--s2) var(--s2) calc(env(safe-area-inset-bottom) + var(--s1));background:color-mix(in srgb,var(--gray6) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--gray4);z-index:5}
nav button{background:none;color:var(--gray1);font-size:var(--footnote);font-weight:500;padding:var(--s1) 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0}
nav button.on{color:var(--ink)}
nav button:active{transform:none}
/* Поле ввода — одно на весь пульт. Появляется, только когда на телевизоре ждут текст (или нажали «Поиск»):
   сверху, с тонкой линией и тенью, как выбранное на экране телевизора. */
.typebar{display:none;position:sticky;top:calc(env(safe-area-inset-top) + var(--s2));z-index:4;margin:0 0 var(--s4);box-shadow:0 0 0 1px var(--hairline),0 12px 40px var(--scrim)}
.typebar.on{display:block}
.typebar .hint{font-size:var(--callout);color:var(--secondary);padding:var(--s2) var(--s3) 0}
#t{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:color-mix(in srgb,var(--gray6) 95%,transparent);padding:var(--s3) var(--s5);border-radius:var(--r-pill);font-size:var(--body);opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;z-index:6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="glow"></div>
<h1 id="title">Пульт</h1>
<!-- На телевизоре открыта клавиатура: печатаем здесь, текст уходит в поле на экране. -->
<div class="card typebar" id="typebar"><div class="hint" id="tv-hint">Печатай — текст появится на телевизоре</div><div class="row"><input type="text" id="tv-in" enterkeyhint="done" autocomplete="off" autocorrect="off"><button onclick="sendType(true)">Готово</button></div></div>

<section class="tab on" id="remote">
  <div class="dock" id="dock"></div>
  <div class="pad">
    <button class="u" data-key="DPAD_UP" aria-label="Вверх"></button>
    <button class="l" data-key="DPAD_LEFT" aria-label="Влево"></button>
    <button class="ok" data-key="DPAD_CENTER" aria-label="ОК"></button>
    <button class="rt" data-key="DPAD_RIGHT" aria-label="Вправо"></button>
    <button class="d" data-key="DPAD_DOWN" aria-label="Вниз"></button>
  </div>
  <div class="keys">
    <button data-key="BACK" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button onclick="go('home',{})" aria-label="Домой"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
    <button data-key="MEDIA_PLAY_PAUSE" aria-label="Пауза"><svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7z"/><path d="M16 6v12M20 6v12"/></svg></button>
    <button onclick="go('vol',{d:'down'})" aria-label="Тише"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 12h4"/></svg></button>
    <button onclick="go('vol',{d:'mute'})" aria-label="Без звука"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
    <button onclick="go('vol',{d:'up'})" aria-label="Громче"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 12h4M19 10v4"/></svg></button>
    <button class="danger" onclick="powerOff()" aria-label="Выключить телевизор"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1011.4 0"/></svg></button>
    <button onclick="go('key',{c:'MENU'})" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button onclick="openSearch()" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  </div>
  <h2>VPN и сон</h2>
  <div class="card list">
    <label><span class="name">VPN<small id="vpnl">Happ</small></span><input type="checkbox" class="sw" id="vpn" onchange="go('vpn',{on:this.checked?1:0})"></label>
    <button onclick="sleepNext()"><span class="name">Таймер сна<small id="sleepl">Выключен</small></span><svg viewBox="0 0 24 24" class="muted"><path d="M20 15A8 8 0 019 4a8 8 0 1011 11z"/></svg></button>
  </div>
</section>

<section class="tab" id="apps">
  <div class="card"><div class="row"><button class="file s">Установить APK с телефона<input type="file" accept=".apk,application/vnd.android.package-archive" onchange="installApk(this)"></button></div><progress id="ip" max="1"></progress></div>
  <h2>Можно смело отключить</h2><div class="card list" id="bloat"></div>
  <h2>Установленные</h2><div class="card list" id="user"></div>
  <h2>Встроенные</h2><div class="card list" id="sys"></div>
</section>

<section class="tab" id="tv">
  <div class="stats">
    <div class="stat"><span>Процессор</span><b id="cpu">—</b><div class="bar"><i id="cpub"></i></div></div>
    <div class="stat"><span id="raml">Память</span><b id="ram">—</b><div class="bar"><i id="ramb"></i></div></div>
    <div class="stat"><span>Температура</span><b id="temp">—</b></div>
    <div class="stat"><span id="netl">Сеть, Мбит/с</span><b id="net">—</b></div>
    <div class="stat wide"><span>Свободно на диске</span><b id="disk">—</b></div>
  </div>
  <h2>Открыть ссылку на телевизоре</h2>
  <div class="card"><div class="row"><input type="url" id="u" placeholder="YouTube, ВК, Рутуб"><button onclick="go('open',{u:val('u')})">Открыть</button></div></div>
  <h2>Больше всего памяти</h2><div class="card list" id="top"></div>
  <h2>Настройки</h2>
  <div class="card list">
    <label><span class="name">Быстрые анимации<small>Меню и переходы вдвое быстрее</small></span><input type="checkbox" class="sw" id="anim" onchange="tweak('anim',this.checked)"></label>
    <label><span class="name">Блокировка рекламы<small>Через DNS AdGuard, для всех приложений</small></span><input type="checkbox" class="sw" id="dns" onchange="tweak('dns',this.checked)"></label>
  </div>
  <h2>Действия</h2>
  <div class="card list">
    <button onclick="shot()"><span class="name">Снимок экрана</span></button>
    <button onclick="tweak('trim')"><span class="name">Очистить кэш приложений<small>Входы и данные остаются</small></span></button>
    <button onclick="tweak('devsettings')"><span class="name">Доступ к отладке<small>Там же можно отозвать все разрешения</small></span></button>
    <button onclick="if(confirm('Перезагрузить телевизор?'))tweak('reboot')"><span class="name danger">Перезагрузить телевизор</span></button>
  </div>
  <div id="shotbox"></div>
</section>

<section class="tab" id="files">
  <div class="seg" id="fseg"><button class="on" data-d="Download">Загрузки</button><button data-d="Movies">Фильмы</button></div>
  <h2>Отправить на телевизор</h2>
  <div class="card"><div class="row"><button class="file s">Выбрать файл<input type="file" onchange="upload(this)"></button></div><progress id="up" max="1"></progress></div>
  <h2>На телевизоре</h2><div class="card list" id="flist"></div>
</section>

<nav id="nav">
  <button class="on" data-t="remote" data-name="Пульт"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="4"/><circle cx="12" cy="9" r="2.5"/><path d="M10 15h4M10 18h4"/></svg>Пульт</button>
  <button data-t="apps" data-name="Приложения"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Приложения</button>
  <button data-t="tv" data-name="Телевизор"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2.5"/><path d="M8 21h8"/></svg>Телевизор</button>
  <button data-t="files" data-name="Файлы"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Файлы</button>
</nav>
<div id="t" role="status"></div>

<script>
// Ключ из QR-кода: в адресе при первом открытии, дальше — в памяти телефона (для значка на экране «Домой»).
let k=new URLSearchParams(location.search).get('k');
try{if(k)localStorage.setItem('k',k);else k=localStorage.getItem('k')}catch(e){}
const $=i=>document.getElementById(i);
function val(i){return $(i).value.trim()}
function toast(s){const t=$('t');t.textContent=s;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,1800)}
function url(w,a){a=a||{};a.k=k;return '/'+w+'?'+new URLSearchParams(a)}
async function call(w,a){const r=await fetch(url(w,a));return r.json()}
async function go(w,a){try{const j=await call(w,a);if(j.say)toast(j.say);return j}catch(e){toast('Телевизор не ответил')}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function mb(n){return n>=1024?(n/1024).toFixed(1).replace('.',',')+' ГБ':n+' МБ'}
function glow(c){document.documentElement.style.setProperty('--glow',c)}


const tabGlow={remote:null,apps:'var(--blue)',tv:'var(--green)',files:'var(--orange)'};
let lastAccent='var(--orange)';
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id===b.dataset.t));
  $('title').textContent=b.dataset.name;glow(tabGlow[b.dataset.t]||lastAccent);scrollTo(0,0);
  if(b.dataset.t==='apps')loadApps();if(b.dataset.t==='files')loadFiles();if(b.dataset.t==='tv'){stats();topApps()}
});

// Кнопки пульта: зажатая повторяет нажатие.
document.querySelectorAll('[data-key]').forEach(b=>{
  let rep;const send=()=>go('key',{c:b.dataset.key});
  b.addEventListener('pointerdown',e=>{e.preventDefault();send();rep=setTimeout(function r(){send();rep=setTimeout(r,180)},450)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(rep)));
});
// Выключение — как кнопка питания пульта. Включить с телефона нельзя: во сне телевизор отключает Wi-Fi.
async function powerOff(){await go('power',{on:0})}

// Док: те же логотипы, что на телевизоре, серые в покое и цветные под пальцем; свет — цветом приложения.
fetch(url('apps')).then(r=>r.json()).then(l=>{l.slice(0,8).forEach(x=>{
  const b=document.createElement('button');b.className='app';
  b.setAttribute('aria-label',x.label);
  b.innerHTML='<img alt="" src="'+url('logo',{p:x.pkg,v:x.v||0})+'">';
  b.onclick=()=>{lastAccent=x.accent||lastAccent;glow(lastAccent);document.querySelectorAll('.app').forEach(a=>a.classList.toggle('lit',a===b));go('app',{p:x.pkg})};
  $('dock').appendChild(b)})});

let sleepLeft=0;
function sleepNext(){const m=sleepLeft===0?30:sleepLeft<=30?60:sleepLeft<=60?90:0;sleepLeft=m;$('sleepl').textContent=m?'Через '+m+' мин':'Выключен';go('sleep',{m})}

async function loadApps(){
  let l;try{l=await call('pkgs')}catch(e){toast('Телевизор не ответил');return}
  if(l.say){toast(l.say);return}
  ['bloat','user','sys'].forEach(i=>$(i).innerHTML='');
  l.forEach(x=>{
    const box=$(x.bloat?'bloat':x.user?'user':'sys');
    const b=document.createElement('button');
    b.innerHTML='<span class=name>'+esc(x.label)+'<small>'+esc(x.pkg)+'</small></span><span class=tag>'+(x.off?'отключено':x.keep?'системное':'')+'</span>';
    b.onclick=()=>{const n=b.nextElementSibling;if(n&&n.classList.contains('acts')){n.remove();return}
      const a=document.createElement('div');a.className='acts';
      const add=(t,w,c)=>{const q=document.createElement('button');q.className=c||'s';q.textContent=t;q.onclick=async()=>{const j=await go('pkg',{p:x.pkg,a:w});if(j&&j.say==='Готово')loadApps()};a.appendChild(q)};
      if(!x.keep){add('Остановить','stop');add(x.off?'Включить':'Отключить',x.off?'enable':'disable');if(x.user)add('Удалить','uninstall','r')}else if(x.off)add('Включить','enable');
      if(!a.children.length){a.innerHTML='<span class=tag>Это нужно телевизору, не трогаю</span>'}
      b.after(a)};
    box.appendChild(b)});
  ['bloat','user','sys'].forEach(i=>{if(!$(i).children.length)$(i).innerHTML='<div><span class="name tag">Пусто</span></div>'});
}

function sendFile(path,file,bar,done){
  const x=new XMLHttpRequest();x.open('POST',path);bar.style.display='block';bar.value=0;
  x.upload.onprogress=e=>{if(e.lengthComputable)bar.value=e.loaded/e.total};
  x.onload=()=>{bar.style.display='none';try{toast(JSON.parse(x.responseText).say||'Готово')}catch(e){toast('Готово')}done&&done()};
  x.onerror=()=>{bar.style.display='none';toast('Телевизор не ответил')};x.send(file)}
function installApk(i){const f=i.files[0];if(!f)return;toast('Ставлю '+f.name);sendFile(url('install'),f,$('ip'),loadApps);i.value=''}

let dir='Download';
document.querySelectorAll('#fseg button').forEach(b=>b.onclick=()=>{dir=b.dataset.d;document.querySelectorAll('#fseg button').forEach(x=>x.classList.toggle('on',x===b));loadFiles()});
async function loadFiles(){
  let l;try{l=await call('files',{d:dir})}catch(e){toast('Телевизор не ответил');return}
  const box=$('flist');box.innerHTML='';
  if(l.say){toast(l.say);return}
  if(!l.length)box.innerHTML='<div><span class="name tag">Пусто</span></div>';
  l.forEach(f=>{const r=document.createElement('div');
    r.innerHTML='<span class=name>'+esc(f.name)+'<small>'+mb(Math.max(1,Math.round(f.size/1048576)))+'</small></span>';
    const a=document.createElement('a');a.href=url('get',{d:dir,n:f.name});a.download=f.name;a.textContent='Скачать';
    const del=document.createElement('button');del.className='r';del.textContent='Удалить';
    del.onclick=async()=>{if(confirm('Удалить '+f.name+'?')){await go('rm',{d:dir,n:f.name});loadFiles()}};
    r.append(a,del);box.appendChild(r)})}
function upload(i){const f=i.files[0];if(!f)return;sendFile(url('upload',{d:dir,n:f.name}),f,$('up'),loadFiles);i.value=''}

async function stats(){
  if(!$('tv').classList.contains('on'))return;
  try{const s=await call('stats');
    if(s.cpu!=null){$('cpu').textContent=s.cpu+'%';$('cpub').style.width=s.cpu+'%'}
    const used=s.ramTotal-s.ramFree;$('ram').textContent=Math.round(100*used/s.ramTotal)+'%';$('raml').textContent='Память · '+used+'/'+s.ramTotal+' МБ';$('ramb').style.width=Math.round(100*used/s.ramTotal)+'%';
    if(s.temp!=null)$('temp').textContent=s.temp+'°';
    if(s.down!=null){$('net').textContent='↓ '+(s.down/1000).toFixed(1).replace('.',',');$('netl').textContent='Мбит/с · ↑ '+(s.up/1000).toFixed(1).replace('.',',')}
    $('disk').textContent=mb(s.diskFree)+' из '+mb(s.diskTotal);
  }catch(e){}
  setTimeout(stats,2500)}
async function topApps(){
  if(!$('tv').classList.contains('on'))return;
  try{const l=await call('top');if(Array.isArray(l)){const box=$('top');box.innerHTML='';
    l.forEach(x=>{const r=document.createElement('div');r.innerHTML='<span class=name>'+esc(x.label)+'<small>'+esc(x.pkg)+'</small></span><span class=tag>'+x.mb+' МБ</span>';box.appendChild(r)})}}catch(e){}
  setTimeout(topApps,12000)}
async function tweak(w,on){await go('tweak',{w,v:on?1:0});state()}
async function state(){try{const s=await call('state');$('anim').checked=!!s.anim;$('dns').checked=!!s.dns;
  if(s.vpn!=null){$('vpn').checked=!!s.vpn;$('vpnl').textContent=s.vpn?(s.place||'Включён'):'Выключен'}
  onYouTube=!!s.yt;
  // Поле ввода появляется само, когда на телевизоре открыта клавиатура (любое приложение), и прячется, когда закрыта.
  if(s.typing==='ime'&&fieldMode!=='ime')showField('ime');
  else if(s.typing!=='ime'&&fieldMode==='ime')hideField();
  if(s.sleep!=null){sleepLeft=s.sleep;$('sleepl').textContent=s.sleep?'Через '+s.sleep+' мин':'Выключен'}}catch(e){}}
function shot(){toast('Снимаю экран');const img=new Image();img.className='shot';img.alt='Снимок экрана телевизора';
  img.onload=()=>{$('shotbox').innerHTML='';const a=document.createElement('a');a.href=img.src;a.download='tv.png';a.appendChild(img);$('shotbox').appendChild(a)};
  img.onerror=()=>toast('Не получилось снять экран');img.src=url('shot',{t:Date.now()})}
// Одно поле на весь пульт. ime — на телевизоре открыта клавиатура: текст уходит прямо в поле, с кириллицей.
// yt — поиск в YouTube (у него своя клавиатура): запрос открывается готовыми результатами.
// tv — поиск лаунчера по всем приложениям.
let fieldMode='',onYouTube=false;
const hints={ime:'Печатай — текст появится на телевизоре',yt:'Поиск на YouTube',tv:'Поиск на телевизоре'};
function showField(m){fieldMode=m;$('tv-hint').textContent=hints[m];$('tv-in').value='';$('typebar').classList.add('on');
  $('tv-in').focus();if(navigator.vibrate)navigator.vibrate(20)}
function hideField(){fieldMode='';$('typebar').classList.remove('on');$('tv-in').blur()}
function openSearch(){if(fieldMode&&fieldMode!=='ime'){hideField();return}showField(onYouTube?'yt':'tv')}
async function sendType(done){const t=$('tv-in').value;
  if(fieldMode==='ime'){$('tv-in').value='';await call('type',{t,done:done?1:0});return}
  if(!done)return;
  const q=t.trim();if(!q){hideField();return}
  hideField();await go(fieldMode==='yt'?'ytsearch':'search',{q})}
$('tv-in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendType(true)}});
// На клавиатуре телевизора каждое слово уходит сразу: после пробела отправляем набранное.
$('tv-in').addEventListener('input',e=>{if(fieldMode==='ime'&&$('tv-in').value.endsWith(' '))sendType(false)});
state();setInterval(state,2000);
</script>
</body>
