plugins {
    id 'com.android.application'
}

// Число коммитов в git; нет git — 13, как было до счёта.
def starwindBuild() {
    try {
        def p = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        def n = p.text.trim()
        p.waitFor()
        return n.isInteger() ? n.toInteger() + 100 : 13
    } catch (ignored) {
        return 13
    }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        // Номер сборки = число коммитов: по нему обновление с GitHub понимает, что новее.
        versionCode starwindBuild()
        versionName '4.' + starwindBuild()
    }

    // Свой ключ подписи: путь и пароль даёт tv deploy (ключ лежит в ~/Documents/Claude, не в git).
    // Нет ключа — подписываем отладочным, как раньше.
    signingConfigs {
        starwind {
            def store = System.getenv('STARWIND_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('STARWIND_KEY_PASS')
                keyAlias 'starwind'
                keyPassword System.getenv('STARWIND_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig System.getenv('STARWIND_KEYSTORE') ? signingConfigs.starwind : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // QR-код для пульта в телефоне.
    implementation 'com.google.zxing:core:3.5.3'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
