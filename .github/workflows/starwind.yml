# Проверка Starwind на каждый push: тесты дизайн-системы, пульта, навигации и разбора лент (без Android и телевизора).
name: starwind-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: LANG=C.UTF-8 bash starwind/test/run.sh
